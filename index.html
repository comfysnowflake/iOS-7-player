<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light dark}body{margin:0}</style><title>Плеєр iOS 7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap">
<style>
/* Layout: рамка 320x568. Зверху смужка часу і нав-бар, знизу таб-бар з п'яти вкладок, між ними екран зі списками. */
:root{
  --bg:#ffffff; --cell:#ffffff; --group:#efeff4; --outer:#dedee3; --fg:#000000; --sub:#8e8e93; --line:#c8c7cc;
  --accent:#f9304f; --bar:rgba(248,248,248,.92); --track:#dcdce1; --chip:rgba(142,142,147,.16);
  --ico:#929297; --chev:#c7c7cc; --shadow:rgba(0,0,0,.30);
  --font:'Roboto','Helvetica Neue',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --cell:#1c1c1e; --group:#000000; --outer:#121214; --fg:#ffffff; --sub:#8e8e93; --line:#38383a;
    --accent:#ff3b5c; --bar:rgba(22,22,24,.92); --track:#3a3a3d; --chip:rgba(150,150,160,.2);
    --ico:#8e8e93; --chev:#5a5a5e; --shadow:rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1c1c1e; --group:#000000; --outer:#121214; --fg:#ffffff; --sub:#8e8e93; --line:#38383a;
  --accent:#ff3b5c; --bar:rgba(22,22,24,.92); --track:#3a3a3d; --chip:rgba(150,150,160,.2);
  --ico:#8e8e93; --chev:#5a5a5e; --shadow:rgba(0,0,0,.7); color-scheme:dark;
}
/* Вибір теми всередині плеєра (Ще → Тема) має пріоритет над системною */
:root[data-skin="light"]{
  --bg:#ffffff; --cell:#ffffff; --group:#efeff4; --outer:#dedee3; --fg:#000000; --sub:#8e8e93; --line:#c8c7cc;
  --accent:#f9304f; --bar:rgba(248,248,248,.92); --track:#dcdce1; --chip:rgba(142,142,147,.16);
  --ico:#929297; --chev:#c7c7cc; --shadow:rgba(0,0,0,.30); color-scheme:light;
}
:root[data-skin="dark"]{
  --bg:#000000; --cell:#1c1c1e; --group:#000000; --outer:#121214; --fg:#ffffff; --sub:#8e8e93; --line:#38383a;
  --accent:#ff3b5c; --bar:rgba(22,22,24,.92); --track:#3a3a3d; --chip:rgba(150,150,160,.2);
  --ico:#8e8e93; --chev:#5a5a5e; --shadow:rgba(0,0,0,.7); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--outer);color:var(--fg);font-family:var(--font);font-weight:400;font-size:17px;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font-family:inherit}
svg{display:block}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Весь інтерфейс живе в рамці 320x568 (вертикальні 9:16), яку JS масштабує під вікно */
body{position:relative}
#app{position:absolute;left:50%;top:50%;width:320px;height:568px;background:var(--bg);overflow:hidden;transform:translate(-50%,-50%);transform-origin:50% 50%;box-shadow:0 0 0 1px var(--line),0 12px 60px var(--shadow)}

/* Нав-бар iOS 7: смужка часу 20 пт і рядок 44 пт */
.nav{position:absolute;top:0;left:0;right:0;height:64px;z-index:10;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.nav-time{height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.nav-row{height:44px;display:flex;align-items:center}
.nl,.nr{flex:1 1 0;min-width:0;display:flex;align-items:center;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:17px}
.nl{justify-content:flex-start;padding-left:8px;gap:6px;text-align:left}
.nl.add{padding-left:15px}
.nl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nl svg{width:12px;height:21px;flex:none;fill:none;stroke:var(--accent);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.nr{justify-content:flex-end;padding-right:8px;gap:6px;font-size:11px;line-height:12px;text-align:right}
.nr svg{width:11px;height:20px;flex:none;fill:none;stroke:var(--accent);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.inv{visibility:hidden}
.nav-title{flex:none;max-width:150px;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}

/* Екран */
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-top:64px;padding-bottom:49px;overscroll-behavior:contain;background:var(--bg)}
.scroll.grp{background:var(--group)}
#screen{min-height:100%}
#screen.push{animation:pushIn .3s cubic-bezier(.2,.8,.2,1)}
#screen.pop{animation:popIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pushIn{from{transform:translateX(36px);opacity:.15}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-28px);opacity:.15}to{transform:none;opacity:1}}
.searchwrap{padding:8px 8px 6px;background:var(--bg)}
.search{display:flex;align-items:center;gap:6px;height:30px;border-radius:8px;background:var(--chip);padding:0 8px;color:var(--sub)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;font-weight:300}
.search input::placeholder{color:var(--sub)}
.search input::-webkit-search-cancel-button{opacity:.6}
.foot{padding:16px 24px 20px;text-align:center;color:var(--sub);font-size:12px;line-height:1.5}
.sech{padding:16px 15px 6px;font-size:12px;font-weight:500;color:var(--sub);text-transform:uppercase;letter-spacing:.03em}
.noc{position:absolute;left:0;right:0;top:64px;bottom:49px;z-index:5;overflow:hidden;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 28px 18px;background:#141c26}
.noc.on{display:flex}
.noc .nb{position:absolute;inset:-60px;background-size:cover;background-position:center;-webkit-filter:blur(34px) saturate(1.9) brightness(.42);filter:blur(34px) saturate(1.9) brightness(.42)}
.noc .nd{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,22,.55) 0%,rgba(8,12,22,.2) 55%,rgba(8,12,22,.3) 100%)}
.noc .nt,.noc .ns{position:relative;color:#38779e}
.noc .nt{font-size:25px;font-weight:300;line-height:30px;margin-bottom:12px}
.noc .ns{font-size:17px;font-weight:300;line-height:22px;max-width:290px}
.empty{padding:70px 30px;text-align:center;color:var(--sub);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--fg);font-size:17px;font-weight:500;margin-bottom:6px}
.pill{margin-top:16px;border:1px solid var(--accent);background:none;color:var(--accent);font:inherit;font-size:15px;padding:7px 18px;border-radius:6px;cursor:pointer}

/* Рядки треків */
.trow{position:relative;display:flex;align-items:center;min-height:44.5px;padding-left:14px;cursor:pointer;background:var(--bg);-webkit-user-select:none;user-select:none}
.trow::after,.lrow::after{content:"";position:absolute;left:14px;right:13px;bottom:0;height:.5px;background:var(--line)}
.trow:active,.lrow:active{background:var(--chip)}
@media (hover:hover){.trow:hover,.lrow:hover{background:var(--chip)}}
.tnum{flex:none;width:26px;font-size:14px;color:var(--fg);opacity:.85;font-variant-numeric:tabular-nums}
.tt{flex:1;min-width:0;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.two{min-height:52px}
.tt2{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tt2 .t{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt2 .s{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.on .tt2 .t{color:var(--accent)}
.d{flex:none;width:30px;margin-right:15px;text-align:right;font-size:14px;color:var(--fg);opacity:.85;font-variant-numeric:tabular-nums}
.cloud{flex:none;width:46px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0;cursor:pointer}
.cloudgap{flex:none;width:46px}
.cloud svg,.abtn.cl svg{width:26px;height:26px}
.cl-o{fill:none;stroke:var(--ico);stroke-width:1.2;stroke-linejoin:round}
.cl-a{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.eq{display:none;align-items:flex-end;gap:2px;height:12px;flex:none}
.eq i{display:block;width:3px;height:100%;background:var(--accent);transform-origin:bottom;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-duration:.7s;animation-delay:-.3s}
.eq i:nth-child(3){animation-duration:1.1s;animation-delay:-.6s}
#app:not(.playing) .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.trow.on .eq{display:flex}
.eq.l{position:absolute;left:14px;top:50%;margin-top:-6px}
.eq.r{margin-right:8px}
.trow.on .tnum{visibility:hidden}
.trow:focus-visible,.lrow:focus-visible,.gcell:focus-visible,.tab:focus-visible,.nl:focus-visible,.nr:focus-visible,.mrow:focus-visible,.abtn:focus-visible,.cloud:focus-visible,.skseg button:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* Шапка альбому: позиції з еталона */
.ahead{position:relative;height:117px;background:var(--bg)}
.ahead::after{content:"";position:absolute;left:14px;right:13px;bottom:0;height:.5px;background:var(--line)}
.acover{position:absolute;left:14px;top:13px;width:89px;height:89px;object-fit:cover;box-shadow:0 0 0 .5px var(--line)}
.atitle{position:absolute;left:112px;right:12px;top:6px;line-height:26px;font-size:19px;font-weight:500;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ameta{position:absolute;left:112px;right:12px;top:31px;line-height:18px;font-size:13px}
.ameta b{font-weight:500}
.ayear{position:absolute;left:112px;right:12px;top:49px;line-height:18px;font-size:13px;color:var(--fg);opacity:.62;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abtn{position:absolute;width:44px;height:44px;display:grid;place-items:center;border:0;background:none;padding:0;cursor:pointer}
.abtn.cl{left:233px;top:64px}
.abtn.sh{left:276px;top:68px;color:var(--ico)}
.abtn.sh svg{width:22px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* Сітка альбомів, списки виконавців і станцій */
.grid{display:grid;grid-template-columns:repeat(2,142px);gap:14px 12px;padding:14px 12px 18px}
.gcell{display:block;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}
.gcell img{display:block;width:142px;height:142px;object-fit:cover;box-shadow:0 0 0 .5px var(--line)}
.gname,.gart{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gname{font-weight:500;margin-top:6px}
.gart{color:var(--sub);margin-top:1px}
.lrow{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px 0 14px;cursor:pointer;background:var(--bg);-webkit-user-select:none;user-select:none}
.lrow.big{min-height:68px}
.lthumb{width:50px;height:50px;flex:none;object-fit:cover;box-shadow:0 0 0 .5px var(--line)}
.lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lt .t{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt .s{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:8px;height:14px;flex:none;fill:none;stroke:var(--chev);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Ще: згруповані списки */
.more{padding-bottom:18px}
.gh{padding:22px 15px 7px;font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.02em}
.gtab{background:var(--cell);border-top:.5px solid var(--line);border-bottom:.5px solid var(--line)}
.mrow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 15px;font-size:16px;cursor:pointer}
.mrow+.mrow::before{content:"";position:absolute;top:0;left:15px;right:0;height:.5px;background:var(--line)}
.mrow.red{color:var(--accent)}
.mrow.dim{opacity:.45}
.gf{padding:8px 15px 0;font-size:12px;line-height:1.45;color:var(--sub)}
.skseg{display:flex;width:100%;border:1px solid var(--accent);border-radius:5px;overflow:hidden}
.skseg button{flex:1;border:0;border-left:1px solid var(--accent);background:transparent;color:var(--accent);font:inherit;font-size:13px;font-weight:500;padding:6px 0;cursor:pointer}
.skseg button:first-child{border-left:0}
.skseg button.on{background:var(--accent);color:#fff}

/* Таб-бар */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:49px;z-index:10;display:flex;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
.tab{flex:1;min-width:0;border:0;background:none;color:var(--ico);display:flex;flex-direction:column;align-items:center;padding:4px 0 0;cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:.01em}
.tab svg{width:30px;height:28px;display:block;flex:none}
.tab span{margin-top:3px;line-height:12px;white-space:nowrap}
.tab.sel{color:var(--accent)}
.tab .fl{fill:none;stroke:currentColor;stroke-width:1.4}
.tab.sel .fl{fill:currentColor;stroke:none}
.tab .ln{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.tab .fi{fill:currentColor}
.tab .dot,.tab .nt{fill:currentColor}
.tab.sel .dot,.tab.sel .nt{fill:var(--bg)}

/* Now Playing: обкладинка на всю ширину під нав-баром, бігуча стрічка, три текстові кнопки внизу (позиції з еталона) */
.sheet{position:absolute;inset:0;z-index:30;background:var(--bg);overflow:hidden;
  transform:translateY(102%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s}
.sheet.open{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sh-nav{position:absolute;top:0;left:0;right:0;height:64px;z-index:2;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.nr .lst{width:22px;height:18px;stroke-width:2.2}
.nr .lst circle{fill:var(--accent);stroke:none}
.s-art{position:absolute;left:0;top:64px;width:320px;height:320px;object-fit:cover;display:block;background:var(--chip)}
.s-scrub{position:absolute;left:15px;right:12px;top:388px;height:18px;display:flex;align-items:center;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.s-scrub span{flex:none;width:40px}
.s-scrub span:last-child{width:44px;text-align:right}
.s-scrub input{flex:1;min-width:0}
/* Бігуча стрічка: якщо текст не вміщається, він їде по колу */
.mq{position:absolute;left:0;right:0;overflow:hidden;white-space:nowrap;display:flex;justify-content:center}
.mq-in{display:inline-flex;flex:none}
.mq-in span{flex:none}
.mq-in span:last-child{display:none}
.mq.run{justify-content:flex-start}
.mq.run .mq-in span:first-child{padding-right:48px}
.mq.run .mq-in span:last-child{display:block}
.mq.run .mq-in{animation:marq var(--md,10s) linear infinite}
@keyframes marq{0%,10%{transform:translateX(0)}100%{transform:translateX(calc(var(--mw,0px) * -1))}}
.s-title{top:416px;height:26px;line-height:26px;font-size:17px;font-weight:500}
.s-sub{top:447px;height:20px;line-height:20px;font-size:12.5px;color:var(--sub)}
.s-ctl{position:absolute;left:0;right:0;top:474px;height:36px;display:flex;justify-content:center}
.sbtn{width:86px;height:36px;border:0;background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.sbtn svg{fill:currentColor;overflow:visible}
.sbtn.sk svg{width:28px;height:17px;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}
.sbtn.pp svg{width:20px;height:24px}
.sbtn:active{opacity:.45}
.sbtn:focus-visible,.tbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.s-vol{position:absolute;left:0;right:0;top:516px;height:20px;display:flex;align-items:center;padding-left:26px;padding-right:22px;gap:14px;color:var(--sub)}
.s-vol svg{flex:none;fill:currentColor}
.s-vol .vlo{width:10px;height:12px}
.s-vol .vhi{width:20px;height:15px;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;margin-left:-8px}
.s-vol input{flex:1;min-width:0}
.s-modes{position:absolute;left:17px;right:16px;top:546px;height:20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.s-modes #rep{justify-self:start}.s-modes #sheetLock{justify-self:center}.s-modes #shuf{justify-self:end}
.s-modes .tbtn{white-space:nowrap}
.tbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:12px;line-height:16px;padding:2px 6px;margin:0 -6px;border-radius:4px;cursor:pointer}
.tbtn[aria-pressed="true"]{background:var(--accent);color:#fff}
#sheet input[type=range]{height:20px}
#sheet input.sk::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:linear-gradient(to right,var(--accent) var(--p),var(--track) var(--p))}
#sheet input.sk::-moz-range-track{height:2px;border-radius:1px;background:var(--track)}
#sheet input.sk::-moz-range-progress{height:2px;border-radius:1px;background:var(--accent)}
#sheet input.sk::-webkit-slider-thumb{-webkit-appearance:none;width:2px;height:13px;border-radius:1px;background:var(--accent);margin-top:-5.5px;border:0}
#sheet input.sk::-moz-range-thumb{width:2px;height:13px;border-radius:1px;background:var(--accent);border:0}
#sheet input.vk::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:linear-gradient(to right,var(--fg) var(--p),var(--track) var(--p))}
#sheet input.vk::-moz-range-track{height:2px;border-radius:1px;background:var(--track)}
#sheet input.vk::-moz-range-progress{height:2px;border-radius:1px;background:var(--fg)}
#sheet input.vk::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-7px;border:0;box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.35)}
#sheet input.vk::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.35)}

/* Повзунки */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer;--p:0%}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:linear-gradient(to right,var(--fg) var(--p),var(--track) var(--p))}
input[type=range]::-moz-range-track{height:2px;border-radius:1px;background:var(--track)}
input[type=range]::-moz-range-progress{height:2px;border-radius:1px;background:var(--fg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--fg);margin-top:-4.5px;border:0}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--fg);border:0}

/* Іконки play/pause */
.i-pause{display:none}
#app.playing .i-play{display:none}
#app.playing .i-pause{display:block}

.toast{position:absolute;left:50%;bottom:62px;transform:translate(-50%,12px);max-width:calc(100% - 32px);z-index:50;
  background:rgba(40,40,44,.92);color:#fff;font-size:14px;font-weight:400;padding:10px 16px;border-radius:18px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.drop{position:absolute;inset:0;z-index:60;display:none;place-items:center;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.drop.show{display:grid}
.drop div{border:2px dashed var(--accent);border-radius:16px;padding:36px 28px;color:var(--accent);font-size:18px;font-weight:500;text-align:center;margin:16px}

  async function readId3(file, head){

      if(ver === 2){

      else if(id === 'TPE1' || id === 'TP1') out.artist = decodeText(data[0], data.subarray(1));
      else if(id === 'TALB' || id === 'TAL') out.album = decodeText(data[0], data.subarray(1));
      else if(id === 'TRCK' || id === 'TRK') out.no = parseInt(decodeText(data[0], data.subarray(1)), 10) || 0;
      else if(id === 'TYER' || id === 'TYE' || id === 'TDRC' || id === 'TDRL'){ var yv = parseInt(decodeText(data[0], data.subarray(1)).slice(0,4), 10); if(yv && !out.year) out.year = yv; }

  function mp4Data(b, s, e){

        var dt = mp4Data(b, cs, ce);

          else if(t === 'aART'){ if(!out.artist) out.artist = utf8(dt.bytes); }
          else if(t === '©alb') out.album = utf8(dt.bytes);

          else if(t === 'covr' && !out.cover) out.cover = imgUrl(dt.bytes, dt.type === 14 ? 'image/png' : dt.type === 13 ? 'image/jpeg' : '');

  async function readMp4(file){

  }

  async function readTags(file){
    try{

  /* Картинка, яку додали разом з аудіо: те саме ім'я, cover/folder/front або єдина картинка */
  var imgUrls = new Map();
  function pickImage(imgs, f){
    if(!imgs.length) return '';
    var base = f.name.replace(/\.[^.]+$/, '').toLowerCase();
    var pick = imgs.find(function(i){ return i.name.replace(/\.[^.]+$/, '').toLowerCase() === base; })
      || imgs.find(function(i){ return /^(cover|folder|front|albumart|album)/i.test(i.name); })
      || (imgs.length === 1 ? imgs[0] : null);
    if(!pick) return '';
    if(!imgUrls.has(pick)){ var pu = URL.createObjectURL(pick); imgUrls.set(pick, pu); blobOf.set(pu, pick); }
    return imgUrls.get(pick);
  }

  /* ---------- бібліотека ---------- */
  function addTrack(o){
    var t = {id: nextId++, title:o.title, artist:o.artist || '', album:o.album || '',
      no:o.no || 0, year:o.year || 0, duration:o.duration || 0, url:o.url, cover:o.cover || '', key:o.key || '',
      file:o.file || null, fileName:o.fileName || '', saved:!!o.saved};

  function updateDur(t){
    var els = screenEl.querySelectorAll('[data-id="' + t.id + '"] .d');
    for(var i=0;i<els.length;i++) els[i].textContent = t.duration ? fmt(t.duration) : '';

  var softT = null;
  function softRender(){
    clearTimeout(softT);
    softT = setTimeout(function(){ var a = document.activeElement; if(a && a.id === 'q') return; render(); }, 250);
  }
  function probe(t){
    var a = new Audio(); a.preload = 'metadata';
    a.onloadedmetadata = function(){

      a.removeAttribute('src');

  /* папки: шлях файлу з вибору папки або з перетягування */
  function relPath(f){ return f.webkitRelativePath || f._path || f.name; }
  function dirOf(f){ var p = relPath(f), i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); }
  function folderName(f){ var d = dirOf(f); return d ? d.slice(d.lastIndexOf('/') + 1) : ''; }

    return new Promise(function(res){
      var out = [];

    });

  async function walkEntry(en, path, out){
    if(en.isFile){

    } else if(en.isDirectory){
      var list = await readAllEntries(en.createReader());
      for(var i=0;i<list.length;i++) await walkEntry(list[i], path + en.name + '/', out);
    }
  }
  async function filesFromDrop(dt){
    var items = dt.items ? Array.prototype.slice.call(dt.items) : [];
    var entries = items.map(function(it){ return it.webkitGetAsEntry ? it.webkitGetAsEntry() : null; }).filter(Boolean);
    if(!entries.length) return Array.prototype.slice.call(dt.files);
    var out = [];
    for(var i=0;i<entries.length;i++) await walkEntry(entries[i], '', out);
    return out;
  }
  async function addFiles(files){
    var all = Array.prototype.slice.call(files);
    var arr = all.filter(function(f){ return /^audio\//.test(f.type) || /\.(mp3|m4a|aac|flac|ogg|opus|wav)$/i.test(f.name); });
    var imgs = all.filter(function(f){ return /^image\//.test(f.type) || /\.(jpe?g|png|webp)$/i.test(f.name); });
    if(!arr.length){ toast(T('tNoAudio')); return; }
    var pcoll = new Intl.Collator(undefined, {numeric:true, sensitivity:'base'});
    arr.sort(function(a, b){ return pcoll.compare(relPath(a), relPath(b)); });
    var added = 0;
    for(var i=0;i<arr.length;i++){
      var f = arr[i], key = f.name + '|' + f.size;
      if(tracks.some(function(t){ return t.key === key; })) continue;
      var tags = await readTags(f);
      var dir = dirOf(f);
      var coverUrl = tags.cover || pickImage(dir ? imgs.filter(function(i){ return dirOf(i) === dir; }) : imgs, f);
      var base = f.name.replace(/\.[^.]+$/, ''), title = tags.title, artist = tags.artist;
      if(!title){
        var m = base.split(' - ');
        if(m.length === 2 && !artist){ artist = m[0].trim(); title = m[1].trim(); } else title = base;
      }
      var album = tags.album || folderName(f);
      var t = addTrack({title:title, artist:artist, album:album, no:tags.no, year:tags.year, cover:coverUrl,
        url:URL.createObjectURL(f), key:key, file:f, fileName:f.name});
      probe(t); added++;
    }
    if(cur == null && tracks.length){ queue = tracks.map(function(t){ return t.id; }); cur = queue[0]; rebuildOrder(); setTrack(cur); }
    render();
    if(added) toast(T('tAdded', {n:added, w:PL(added, 'wTrack')}));
    else toast(T('tDupe'));
  }

  /* ---------- збереження в браузері (IndexedDB): хмарка біля треку ---------- */
  var idb = null;
  function idbReq(r){ return new Promise(function(res, rej){ r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
  function idbOpen(){
    if(idb) return Promise.resolve(idb);
    return new Promise(function(res, rej){
      var req;
      try{ req = indexedDB.open('ios7player', 1); }catch(e){ return rej(e); }
      req.onupgradeneeded = function(){ req.result.createObjectStore('tracks', {keyPath:'key'}); };
      req.onsuccess = function(){ idb = req.result; res(idb); };
      req.onerror = function(){ rej(req.error); };
      req.onblocked = function(){ rej(new Error('blocked')); };
    });
  }
  function store(mode){ return idb.transaction('tracks', mode).objectStore('tracks'); }
  async function idbAll(){ await idbOpen(); return idbReq(store('readonly').getAll()); }
  async function idbPut(rec){ await idbOpen(); return idbReq(store('readwrite').put(rec)); }
  async function idbClear(){ await idbOpen(); return idbReq(store('readwrite').clear()); }
  async function saveTrack(t){
    if(t.saved || !t.file) return true;
    try{
      await idbPut({key:t.key, name:t.fileName, blob:t.file, title:t.title, artist:t.artist, album:t.album, no:t.no, year:t.year,
        duration:t.duration, cover:(t.cover && blobOf.get(t.cover)) || null});
      t.saved = true; return true;
    }catch(e){ return false; }
  }
  async function doSave(list){
    list = list.filter(function(t){ return t && !t.saved && t.file; });
    if(!list.length) return;
    var ok = 0;
    for(var i=0;i<list.length;i++){ if(await saveTrack(list[i])) ok++; }
    render();
    toast(ok ? T('tSaved', {n:ok}) : T('tSaveFail'));
  }
  function removeTracks(pred){
    var gone = tracks.filter(pred);
    if(!gone.length) return;
    tracks = tracks.filter(function(t){ return !pred(t); });
    gone.forEach(function(t){ byIdMap.delete(t.id); });
    queue = queue.filter(function(id){ return byIdMap.has(id); });
    if(cur != null && !byIdMap.has(cur)){
      audio.pause(); cur = null;
      if(tracks.length){ queue = tracks.map(function(t){ return t.id; }); cur = queue[0]; rebuildOrder(); setTrack(cur); }
    } else rebuildOrder();
    updateNow();
  }
  async function restoreSaved(){
    try{
      var rows = await idbAll();
      if(!rows || !rows.length) return;
      removeTracks(function(t){ return /^demo-/.test(t.key); });
      rows.forEach(function(r){
        var cover = '';
        if(r.cover){ cover = URL.createObjectURL(r.cover); blobOf.set(cover, r.cover); }
        addTrack({title:r.title, artist:(r.artist === 'Невідомий виконавець' ? '' : r.artist), album:(r.album === 'Невідомий альбом' ? '' : r.album), no:r.no, year:r.year, duration:r.duration,
          url:URL.createObjectURL(r.blob), cover:cover, key:r.key, file:r.blob, fileName:r.name, saved:true});
      });

  /* ---------- групування: альбоми, виконавці ---------- */

      a.tracks.push(t);
    });
    var out = Array.from(m.values());
    out.forEach(function(a){
      a.tracks.sort(function(x,y){ return ((x.no || 999) - (y.no || 999)) || coll.compare(x.title, y.title); });
      a.tracks.forEach(function(t){ if(!a.cover && t.cover) a.cover = t.cover; if(!a.year && t.year) a.year = t.year; a.dur += t.duration || 0; });
      if(!a.cover) a.cover = coverFor(a.tracks[0]);

  ['pointerdown','pointermove','pointerup','keydown','wheel','touchstart','input'].forEach(function(n){ window.addEventListener(n, touchAct, {passive:true, capture:true}); });
  setInterval(function(){ if(autoSec && !locked && Date.now() - lastAct >= autoSec * 1000) lockScreen(); }, 1000);
  /* режим 16:9: тільки екран блокування (обкладинка зліва, панель справа); інтерфейс - стандартний вертикальний, після розблокування */
  function deskApply(on){
    if(deskMode === on) return;
    deskMode = on; app.classList.toggle('desk', on); fitApp();
  }
  function toggleDesk(){
    deskPref = !deskPref;
    try{ localStorage.setItem('ios7player.desk', deskPref ? '1' : '0'); }catch(e){}
    render();
  }
  function revealPhone(){
    if(!deskMode) return;
    var r = document.body.getBoundingClientRect(), kn = Math.min(r.width / 320, r.height / 568), kd = Math.min(r.width / 1280, r.height / 720), k = kn / kd;
    app.style.setProperty('--pk', k); app.style.setProperty('--px', ((1280 - 320 * k) / 2) + 'px'); app.style.setProperty('--py', ((720 - 568 * k) / 2) + 'px');
    app.classList.add('deskout');
  }
  function unlock(){
    if(!locked) return;
    locked = false; lastAct = Date.now(); clearInterval(clockTimer);
    revealPhone();
    lockEl.classList.add('snap'); lockEl.style.transform = 'translateX(100%)';
    setTimeout(function(){
      if(locked) return;
      lockEl.style.transition = 'none';
      lockEl.classList.remove('on', 'snap'); lockEl.style.transform = ''; lockEl.setAttribute('aria-hidden', 'true');
      void lockEl.offsetWidth;
      lockEl.style.transition = '';
      deskApply(false); app.classList.remove('deskout');
    }, deskMode ? 400 : 320);
  }
  slide.addEventListener('pointerdown', function(e){
    if(e.button > 0) return;
    drag = {x:e.clientX, dx:0}; revealPhone();
    lockEl.classList.remove('snap');
    try{ slide.setPointerCapture(e.pointerId); }catch(err){}
  });
  slide.addEventListener('pointermove', function(e){
    if(!drag) return;
    drag.dx = Math.max(0, (e.clientX - drag.x) / scaleK);
    lockEl.style.transform = 'translateX(' + drag.dx + 'px)';
    slideTxt.style.opacity = Math.max(0, 1 - drag.dx / 160);
  });
  function endDrag(){
    if(!drag) return;
    var dx = drag.dx; drag = null;
    if(dx > 96) unlock();
    else {
      lockEl.classList.add('snap'); lockEl.style.transform = ''; slideTxt.style.opacity = '';
      setTimeout(function(){ if(locked){ lockEl.classList.remove('snap'); app.classList.remove('deskout'); } }, 320);
    }
  }
  slide.addEventListener('pointerup', endDrag);
  slide.addEventListener('pointercancel', endDrag);
  slide.addEventListener('keydown', function(e){ if(e.key === 'Enter') unlock(); });
  $('#sheetLock').addEventListener('click', lockScreen);
  $('#lPlay').addEventListener('click', toggle);
  $('#lPrev').addEventListener('click', function(){ step(-1); });
  $('#lNext').addEventListener('click', function(){ step(1); });

  /* ---------- старт ---------- */
  try{ var sl = localStorage.getItem('ios7player.lang'); if(sl && I18N[sl]) lang = sl; }catch(e){}
  coll = new Intl.Collator(lang, {numeric:true, sensitivity:'base'});
  applyI18n(); updateModes();
  try{ skin = localStorage.getItem('ios7player.skin') || 'light'; }catch(e){}
  if(skin !== 'light' && skin !== 'dark' && skin !== 'auto') skin = 'light';
  applySkin(skin);
  $('#nocBg').style.backgroundImage = 'url("' + DEFAULT_COVER + '")';
  computeVis();
  queue = vis.map(function(t){ return t.id; });
  if(vis.length){ cur = vis[0].id; rebuildOrder(); setTrack(cur); }
  render();
  tick(); updateNow(); updateClock(); setInterval(updateClock, 15000);
  restoreSaved();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(refreshNowText);
})();
</script>
</body></html>
